[tool.poetry]
name = "SnabDB"
version = "1.0.0"
description = "The supply department database is designed for structured storage of orders and tracking the stages of their fulfillment. Customers also have access to the database and can track the current stage of their order"
authors = ["Anastasia Iva <Vatson.1604@gmail.com>"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/Anastasia-0-Iva/SnabDB.git"
repository = "https://github.com/Anastasia-0-Iva/SnabDB.git"
keywords = ["Database", "SQL", "PostgreSQL", "Supply", "PDF", "Python", "PyQt5"]

[tool.poetry.dependencies]
python = "^3.11"
PyQt5 = "5.15.11"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
black = "^22.0.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"